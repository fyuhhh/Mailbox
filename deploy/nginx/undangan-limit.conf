# Pasang ke: /etc/nginx/conf.d/undangan-limit.conf
#
# Zona limit_req harus dideklarasikan di konteks http, bukan di dalam blok
# server, sehingga tidak bisa ikut di berkas situs. Tanpa berkas ini, Nginx
# menolak start dengan "unknown limit_req zone".
#
# 10 permintaan per detik jauh di atas kecepatan seorang petugas kiosk, tetapi
# cukup rendah untuk membuat penebakan kunci lewat jaringan tidak ada gunanya.
# 10r/s terlalu ketat: impor massal data keanggotaan yang sah mengirim ratusan
# permintaan per detik, dan lebih dari separuhnya tertolak 503 — data masuk
# acak terpotong tanpa ada yang menyadari. Pembatas ini ada untuk menahan
# penebakan kunci beruntun, dan 200r/s masih jauh lebih rendah daripada laju
# yang berguna untuk itu.
limit_req_zone $binary_remote_addr zone=undangan_api:10m rate=200r/s;
