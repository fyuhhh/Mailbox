# Undangan digital — Nginx site config
#
# Pasang ke : /etc/nginx/sites-available/undangan.opsjobs.id.conf
# Aktifkan  : ln -s /etc/nginx/sites-available/undangan.opsjobs.id.conf /etc/nginx/sites-enabled/
#
# Berkas ini sengaja HTTP saja. Jalankan certbot setelah diaktifkan dan ia akan
# menyisipkan sendiri blok listen 443 beserta pengalihan HTTP -> HTTPS:
#
#   certbot --nginx -d undangan.opsjobs.id

upstream undangan_api {
    server 127.0.0.1:5010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name undangan.opsjobs.id;

    # Undangan hanya teks dan sedikit CSS; badan permintaan terbesar adalah
    # POST data tamu dari kiosk yang ukurannya di bawah satu kilobyte.
    client_max_body_size 64k;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/javascript application/json;

    # Struk mencetak /U/ huruf besar demi menghemat ruang QR. Nginx meneruskan
    # huruf apa adanya dan Express yang mencocokkan kedua bentuk — tidak ada
    # penulisan ulang di sini, supaya alamat yang dipindai tetap alamat yang
    # tercatat di log.
    location / {
        proxy_pass         http://undangan_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Kiosk memberi tenggat 2,5 detik pada unggahan pertamanya; nilai di
        # bawah ini harus lebih ketat dari tenggat bawaan 60 detik agar Nginx
        # tidak menahan koneksi jauh lebih lama daripada yang ditunggu kiosk.
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
    }

    # Titik akhir sinkronisasi hanya dipakai kiosk, tidak pernah oleh pengunjung.
    # Pembatasan laju di sini menahan penebakan kunci secara beruntun; kunci itu
    # sendiri sudah dibandingkan dengan timingSafeEqual di sisi aplikasi.
    location /api/ {
        limit_req zone=undangan_api burst=500 nodelay;

        proxy_pass         http://undangan_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}
